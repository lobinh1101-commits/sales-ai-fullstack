services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sales_ai
      POSTGRES_USER: sales_ai
      POSTGRES_PASSWORD: sales_ai
    volumes:
      - sales_ai_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U sales_ai -d sales_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: ./backend
    env_file: .env
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
  seed:
    build: ./backend
    env_file: .env
    command: python -m app.seed
    depends_on:
      migrate:
        condition: service_completed_successfully
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build: ./frontend
    ports:
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  sales_ai_db:
